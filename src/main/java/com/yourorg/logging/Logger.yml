logger:
  serviceName: "my-service"
  level: INFO                # default level
  queueCapacity: 10000
  maxBatchSize: 500
  maxBatchMillis: 200
  fsyncOnWalAppend: true

  wal:
    path: "data/wal.log"
    checkpoint: "data/wal.check"

  storage:
    type: file               # file | postgres | kafka | s3
    file:
      path: "data/store.log"
    postgres:
      url: "jdbc:postgresql://localhost:5432/logs"
      user: "logger"
      password: "secret"
    kafka:
      bootstrap: "localhost:9092"
      topic: "logs"

  retention:
    rotateSizeMB: 100
    maxDays: 7
